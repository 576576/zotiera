name: lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # 全仓唯一的检查命令副本：release 与 PR 都只会 uses 本文件
      - name: Lint and unit test
        run: ./gradlew :app:lintPr :app:testDebugUnitTest --stacktrace
