name: Build

# 可复用构建工作流（workflow_call）：只负责把包装出来，不发布。
# 产物名固定为 Zotiera-<version>-<abi>.apk；不传 abi 时两个 ABI 合一，abi 记作 all。

on:
  workflow_call:
    inputs:
      channel:
        description: alpha 用测试密钥与 .pr 后缀；beta / release 用正式签名
        type: string
        required: true
      version_name:
        type: string
        required: true
      version_code:
        type: string
        required: true
      abi:
        description: 只出这一个 ABI（arm64-v8a / x86_64）；留空则两个都打
        type: string
        required: false
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ inputs.abi || '全架构' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - name: Build
        env:
          # 版本由调用方的 prep 计算，这里不再推导
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          ABI: ${{ inputs.abi }}
          # 正式通道才用到；PR 通道走仓库内的固定密钥
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # alpha 是测试包：包名带 .pr、用仓库内固定密钥，能跟正式版并存；
          # beta 与 release 才是正式签名
          case "${{ inputs.channel }}" in
            alpha) TASK=":app:assemblePr" ;;
            beta | release) TASK=":app:assembleRelease" ;;
            *)
              echo "::error::未知通道 ${{ inputs.channel }}" >&2
              exit 1 ;;
          esac
          ABI_ARG=""
          [ -z "$ABI" ] || ABI_ARG="-PzotieraAbi=$ABI"
          ./gradlew "$TASK" ${ABI_ARG:+"$ABI_ARG"} \
            -PzotieraVersionName="$VERSION_NAME" \
            -PzotieraVersionCode="$VERSION_CODE" --stacktrace
      - name: Rename APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          ABI: ${{ inputs.abi }}
        run: |
          set -euo pipefail
          SRC="$(find app/build/outputs/apk -type f -name '*.apk' | head -1)"
          if [ -z "$SRC" ]; then
            echo "没有产出 apk" >&2
            exit 1
          fi
          # 没指定架构时是两个 ABI 合一的包，名字里记成 all
          NAME="Zotiera-${VERSION_NAME}-${ABI:-all}.apk"
          mv "$SRC" "$NAME"
          ls -l "$NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: zotiera-${{ inputs.abi || 'all' }}
          path: Zotiera-*.apk
          if-no-files-found: error
