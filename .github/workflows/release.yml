name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      channel:
        description: pr 只产出测试包，release 才发布
        type: choice
        options: [pr, release]
        default: pr

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prep:
    name: 准备构建参数
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.vars.outputs.channel }}
      version_name: ${{ steps.vars.outputs.version_name }}
      version_code: ${{ steps.vars.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Compute version
        id: vars
        run: |
          set -euo pipefail
          major=$(sed -n 's/^#define ZEROTIER_ONE_VERSION_MAJOR //p' externals/core/version.h)
          minor=$(sed -n 's/^#define ZEROTIER_ONE_VERSION_MINOR //p' externals/core/version.h)
          patch=$(sed -n 's/^#define ZEROTIER_ONE_VERSION_REVISION //p' externals/core/version.h)
          engine="${major}.${minor}.${patch}"
          revision=$(tr -d '[:space:]' < version.txt)
          commits=$(git rev-list --count HEAD)

          # push 没有 dispatch 输入，必须显式走 pr 通道
          channel="pr"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="${{ inputs.channel }}"
          fi

          if [ "$channel" = "release" ]; then
            version_name="${engine}-${revision}"
            version_code=$(( major * 1000000 + minor * 10000 + patch * 100 + revision ))
          else
            version_name="${engine}-pr.${commits}"
            version_code=$(( 100000 + commits ))
          fi

          echo "channel=$channel"
          echo "version_name=$version_name"
          echo "version_code=$version_code"
          {
            echo "channel=$channel"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: 质量门禁
    needs: prep
    uses: ./.github/workflows/lint.yml

  build:
    name: 构建
    needs: [prep, lint]
    uses: ./.github/workflows/build.yml
    with:
      channel: ${{ needs.prep.outputs.channel }}
      version_name: ${{ needs.prep.outputs.version_name }}
      version_code: ${{ needs.prep.outputs.version_code }}
    secrets: inherit

  publish:
    name: 发布
    needs: [prep, build]
    if: needs.prep.outputs.channel == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: zotiera-release
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prep.outputs.version_name }}
        run: |
          set -euo pipefail
          # 产物在 artifact 里保留相对路径（apk/<variant>/xxx.apk），不能只匹配 dist/*.apk
          mapfile -t apks < <(find dist -type f -name '*.apk')
          if [ ${#apks[@]} -eq 0 ]; then
            echo "dist 里没有 apk" >&2
            exit 1
          fi
          gh release create "v${VERSION}" "${apks[@]}" \
            --title "Zotiera ${VERSION}" \
            --notes "ZeroTier 核心 ${VERSION%%-*}；正式签名包。" \
            --draft
