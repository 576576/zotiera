name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PR 只做检查：lint 加单测，不出包
  lint:
    name: 质量门禁
    uses: ./.github/workflows/lint.yml
