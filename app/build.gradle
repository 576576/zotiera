import java.util.Base64

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def prKeystore = file("${rootProject.projectDir}/assets/ci/signing/pr.keystore")

// CI 通过 -P 注入；本地用默认值。必须在 android 块外求值，块内 `project` 会被委托遮蔽。
def zotieraVersionName = (project.findProperty('zotieraVersionName') ?: '1.16.2-1').toString()
def zotieraVersionCode = (project.findProperty('zotieraVersionCode') ?: '1160201').toString().toInteger()
// CI 按架构分包：传了就只打这一个 ABI，不传则两个都打（本地默认）
def zotieraAbi = project.findProperty('zotieraAbi')

// 正式包只认 4 个环境变量；缺任何一个就不配置 release 签名，构建随即失败而不是产出未签名包。
def releaseEnvNames = [
        'ANDROID_KEYSTORE_BASE64',
        'ANDROID_KEYSTORE_PASSWORD',
        'ANDROID_KEY_ALIAS',
        'ANDROID_KEY_PASSWORD',
]
def hasReleaseSigning = releaseEnvNames.every { System.getenv(it) }

android {
    namespace 'net.sumitm.zotiera'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "net.sumitm.zotiera"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode zotieraVersionCode
        versionName zotieraVersionName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [appLabel: 'Zotiera']

        ndk {
            abiFilters(*(zotieraAbi ? [zotieraAbi] : ['arm64-v8a', 'x86_64']))
        }
    }

    signingConfigs {
        // 公开的 .pr 测试密钥：只用于测试通道，不得用于正式分发。
        pr {
            storeFile prKeystore
            storePassword 'zotierapr'
            keyAlias 'zotierapr'
            keyPassword 'zotierapr'
        }
        if (hasReleaseSigning) {
            release {
                def keystore = new File(layout.buildDirectory.get().asFile, 'signing/release.keystore')
                keystore.parentFile.mkdirs()
                keystore.bytes = Base64.decoder.decode(System.getenv('ANDROID_KEYSTORE_BASE64'))
                storeFile keystore
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        pr {
            initWith release
            applicationIdSuffix '.pr'
            manifestPlaceholders = [appLabel: 'Zotiera PR']
            signingConfig signingConfigs.pr
            matchingFallbacks = ['release']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        compose true
    }
}

configurations {
    all {
        exclude module: 'httpclient'
        exclude module: 'commons-logging'
    }
}

dependencies {
    implementation project(':core')
    implementation project(':data')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'commons-io:commons-io:2.11.0'

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    // Expressive 组件只在 1.5.0-alpha 线里，稳定版 1.4.0 没有
    implementation 'androidx.compose.material3:material3:1.5.0-alpha29'
    implementation 'androidx.compose.material3:material3-adaptive-navigation-suite:1.5.0-alpha29'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'commons-validator:commons-validator:1.7'
    //noinspection AnnotationProcessorOnCompilePath
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
}


// 单测里有一条会扫页面源码（UiConventionsTest），页面一改就得重跑，否则会读缓存结果
tasks.withType(Test).configureEach {
    inputs.dir("src/main/kotlin/net/sumitm/zotiera/ui/screens")
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
        .withPropertyName("screenSources")
}
